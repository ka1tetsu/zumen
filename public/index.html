<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d91">
<title>クロスけいさん機</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body data-fontsize="l">

<header class="bar">
  <button id="backBtn" class="bar-btn" hidden>◀ もどる</button>
  <h1 id="barTitle">クロスけいさん機</h1>
  <button id="fontBtn" class="bar-btn" title="文字の大きさ">あ<span class="big">あ</span></button>
</header>

<main>

<!-- ============ ホーム ============ -->
<section id="s-home" class="screen">
  <p class="lead">かべがみが なんロール いるか、けいさんします。</p>

  <button class="huge primary" data-go="photo">
    <span class="num">1</span>
    <span class="txt">しゃしんで はかる<small>ずめんを うつすだけ</small></span>
  </button>

  <button class="huge" data-go="items">
    <span class="num">2</span>
    <span class="txt">じぶんで いれる<small>よこはば と たかさ</small></span>
  </button>

  <div class="row2">
    <button class="flat" data-go="history">きろく</button>
    <button class="flat" data-go="settings">せってい</button>
  </div>
  <p id="offlineNote" class="note"></p>
</section>

<!-- ============ 写真 ============ -->
<section id="s-photo" class="screen" hidden>
  <p class="lead">ずめん(平面図・展開図)を うつしてください。</p>

  <label class="huge primary as-label">
    <span class="num">📷</span>
    <span class="txt">しゃしんを とる<small>カメラが ひらきます</small></span>
    <input id="camInput" type="file" accept="image/*" capture="environment" multiple hidden>
  </label>

  <label class="huge as-label">
    <span class="num">🖼</span>
    <span class="txt">アルバムから えらぶ</span>
    <input id="fileInput" type="file" accept="image/*" multiple hidden>
  </label>

  <div id="shots" class="shots"></div>

  <button id="readBtn" class="huge go" hidden>
    <span class="num">🔍</span>
    <span class="txt">よみとる<small>すこし じかんが かかります</small></span>
  </button>

  <div id="readStatus" class="status" hidden></div>
  <button class="flat" data-go="items">しゃしんを つかわずに いれる</button>
</section>

<!-- ============ 面の一覧 ============ -->
<section id="s-items" class="screen" hidden>
  <div class="titlebar">
    <input id="projTitle" class="titleinput" placeholder="げんば の なまえ(例: 山田さま邸 2F洋室)">
  </div>

  <div id="itemList" class="list"></div>

  <div class="addgrid">
    <button class="add" data-add="wall">＋ かべ</button>
    <button class="add" data-add="ceiling">＋ てんじょう</button>
    <button class="add" data-add="niche">＋ かざり棚</button>
    <button class="add" data-add="cove">＋ 間接照明</button>
  </div>

  <button id="calcBtn" class="huge go sticky">
    <span class="num">＝</span>
    <span class="txt">けいさん する</span>
  </button>
</section>

<!-- ============ 1面の入力 ============ -->
<section id="s-form" class="screen" hidden>
  <h2 id="formTitle" class="h2"></h2>
  <div id="formBody"></div>
  <button id="formOk" class="huge go sticky">
    <span class="num">✓</span>
    <span class="txt">これで よし</span>
  </button>
  <button id="formDelete" class="flat danger">この めんを けす</button>
</section>

<!-- ============ 結果 ============ -->
<section id="s-result" class="screen" hidden>
  <div id="resultMain" class="answer"></div>
  <div id="resultWarn"></div>
  <div id="resultProducts"></div>
  <div id="resultSub" class="card"></div>

  <details id="resultDetail" class="card">
    <summary>うちわけ を みる</summary>
    <div id="resultRows"></div>
  </details>

  <div class="row2">
    <button id="speakBtn" class="flat">🔊 よみあげ</button>
    <button id="copyBtn" class="flat">📋 コピー</button>
  </div>
  <div class="row2">
    <button id="printBtn" class="flat">🖨 いんさつ</button>
    <button id="saveBtn" class="flat">💾 ほぞん</button>
  </div>
  <button class="huge" data-go="items">すうじを なおす</button>
</section>

<!-- ============ 記録 ============ -->
<section id="s-history" class="screen" hidden>
  <div id="historyList" class="list"></div>
</section>

<!-- ============ 設定 ============ -->
<section id="s-settings" class="screen" hidden>
  <div id="settingsBody"></div>
  <button id="resetBtn" class="flat danger">さいしょの せっていに もどす</button>
</section>

</main>

<!-- 印刷用(発注メモ) -->
<div id="printArea" aria-hidden="true"></div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
