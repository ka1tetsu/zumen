# public/ をそのまま GitHub Pages に置く。
#
# 先に一度だけ、GitHub の Settings → Pages → Source を
# 「GitHub Actions」にしておくこと。
# (private リポジトリで Pages を使うには有料プランが必要。
#  無料でやるなら、リポジトリを public にするか、
#  Cloudflare Pages や Netlify に置く)
name: アプリを公開する

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
